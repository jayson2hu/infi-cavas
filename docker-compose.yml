x-server-environment: &server-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 8787
  TRUST_PROXY: "true"
  DATABASE_URL: ${DATABASE_URL:?请填写含URL编码密码的DATABASE_URL}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  APP_SECRET: ${APP_SECRET:?请生成并保存强随机APP_SECRET}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-infinite-canvas}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?请生成S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?请生成强随机S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: "true"
  BILLING_ENABLED: ${BILLING_ENABLED:-true}
  SIGNUP_BONUS_CREDITS: ${SIGNUP_BONUS_CREDITS:-200}
  ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  MODERATION_BLOCKLIST: ${MODERATION_BLOCKLIST:-}

services:
  web:
    image: infinite-canvas-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.conf
    environment:
      PLATFORM_API_BASE: /api
      BRAND_NAME: ${BRAND_NAME:-}
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    image: infinite-canvas-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    environment: *server-environment
    depends_on:
      postgres:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8787/api/health'); process.exit(r.ok ? 0 : 1)"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ic}
      POSTGRES_DB: ${POSTGRES_DB:-ic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请生成强随机POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?请生成S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?请生成强随机S3_SECRET_KEY}
    ports: ["127.0.0.1:${S3_PORT:-9000}:9000"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bucket-init:
    image: infinite-canvas-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["bun", "scripts/ensure-bucket.ts"]
    environment: *server-environment
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres:
  minio:
