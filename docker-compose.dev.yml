services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["bun", "run", "dev"]
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["./server/src:/app/server/src"]
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://ic:${POSTGRES_PASSWORD:-ic}@postgres:5432/ic
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-before-deploy}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ic-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-storage-password}
      BILLING_ENABLED: ${BILLING_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ic}
      POSTGRES_DB: ic
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-dev:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ic -d ic"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ic-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-storage-password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-dev:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-dev:
  minio-dev:
